name: Build Projects

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.mm'
      - '**.plist'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'Build/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86-vc6:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download Visual C++ 6.0
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/VC6SP5.zip" -OutFile "VC6SP5.zip"

      - name: Extract Visual C++ 6.0
        uses: ihiroky/extract-action@v1
        with:
          file_path: VC6SP5.zip
          extract_dir: VC6

      - name: Download DirectX SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/DXSDK90.zip" -OutFile "DXSDK90.zip"

      - name: Extract DirectX SDK
        uses: ihiroky/extract-action@v1
        with:
          file_path: DXSDK90.zip
          extract_dir: DXSDK

      - name: Download Platform SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/PSDK2001.zip" -OutFile "PSDK2001.zip"

      - name: Extract Platform SDK
        uses: ihiroky/extract-action@v1
        with:
          file_path: PSDK2001.zip
          extract_dir: PSDK

      - name: Download game client resources
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/Resources.zip" -OutFile "Resources.zip"
          Expand-Archive -Path "Resources.zip" -DestinationPath "." -Force

      - name: Replace VCVARS32 absolute paths
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'VC6/VC98/Bin/VCVARS32.BAT'
          search-text: 'set VSCommonDir=C:\PROGRA~1\MICROS~2\Common'
          replacement-text: 'set VSCommonDir=${{ github.workspace }}\VC6\Common'

      - name: Replace VCVARS32 absolute paths
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'VC6/VC98/Bin/VCVARS32.BAT'
          search-text: 'set MSDevDir=C:\PROGRA~1\MICROS~2\Common\msdev98'
          replacement-text: 'set MSDevDir=${{ github.workspace }}\VC6\Common\MSDev98'

      - name: Replace VCVARS32 absolute paths
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'VC6/VC98/Bin/VCVARS32.BAT'
          search-text: 'set MSVCDir=C:\PROGRA~1\MICROS~2\VC98'
          replacement-text: 'set MSVCDir=${{ github.workspace }}\VC6\VC98'

      - name: Build solution
        shell: cmd
        env:
          DXSDK_DIR: ${{ github.workspace }}\DXSDK
          PSDK_DIR: ${{ github.workspace }}\PSDK
        run: |
          call "VC6\VC98\Bin\VCVARS32.BAT"
          cd Build
          cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" ..
          nmake

      - name: Copy FMOD library
        shell: cmd
        run: copy Engine\Source\FMOD\api\fmod.dll Build\WoW\bin\

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86-vc6
          path: |
            Build/WoW/bin/UpdateClient.exe
            Build/WoW/bin/Wow.exe
            Build/WoW/bin/WowError.exe
            Build/WoW/bin/WowUpdateHelper.exe
            Build/WoW/bin/fmod.dll
          if-no-files-found: error

  windows-x86-vs2026:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check for Visual Studio 2026
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -version "[18.0,19.0)" -property installationVersion
          if (-not $version) {
            Write-Error "Visual Studio 2026 is not installed on this runner image"
            exit 1
          }
          Write-Output "Visual Studio $version"

      - name: Download DirectX SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/DXSDK2010.zip" -OutFile "DXSDK2010.zip"

      - name: Extract DirectX SDK
        uses: ihiroky/extract-action@v1
        with:
          file_path: DXSDK2010.zip
          extract_dir: DXSDK2010

      - name: Download game client resources
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/Resources.zip" -OutFile "Resources.zip"
          Expand-Archive -Path "Resources.zip" -DestinationPath "." -Force

      - name: Build solution
        shell: cmd
        env:
          DXSDK_DIR: ${{ github.workspace }}\DXSDK2010
        run: |
          cmake -G "Visual Studio 18 2026" -A Win32 -S . -B Build/vs2026
          cmake --build Build/vs2026 --config Release --parallel

      - name: Copy FMOD library
        shell: cmd
        run: copy Engine\Source\FMOD\api\fmod.dll Build\vs2026\WoW\bin\Release\

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86-vs2026
          path: |
            Build/vs2026/WoW/bin/Release/UpdateClient.exe
            Build/vs2026/WoW/bin/Release/Wow.exe
            Build/vs2026/WoW/bin/Release/WowError.exe
            Build/vs2026/WoW/bin/Release/WowUpdateHelper.exe
            Build/vs2026/WoW/bin/Release/fmod.dll
          if-no-files-found: error

  windows-x64-vs2026:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check for Visual Studio 2026
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -version "[18.0,19.0)" -property installationVersion
          if (-not $version) {
            Write-Error "Visual Studio 2026 is not installed on this runner image"
            exit 1
          }
          Write-Output "Visual Studio $version"

      - name: Download DirectX SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/DXSDK2010.zip" -OutFile "DXSDK2010.zip"

      - name: Extract DirectX SDK
        uses: ihiroky/extract-action@v1
        with:
          file_path: DXSDK2010.zip
          extract_dir: DXSDK2010

      - name: Download game client resources
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/Resources.zip" -OutFile "Resources.zip"
          Expand-Archive -Path "Resources.zip" -DestinationPath "." -Force

      - name: Build solution
        shell: cmd
        env:
          DXSDK_DIR: ${{ github.workspace }}\DXSDK2010
        run: |
          cmake -G "Visual Studio 18 2026" -A x64 -S . -B Build/vs2026-x64
          cmake --build Build/vs2026-x64 --config Release --parallel

      - name: Copy FMOD library
        shell: cmd
        run: copy Engine\Source\FMOD\api\fmod64.dll Build\vs2026-x64\WoW\bin\Release\

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-vs2026
          path: |
            Build/vs2026-x64/WoW/bin/Release/UpdateClient.exe
            Build/vs2026-x64/WoW/bin/Release/Wow64.exe
            Build/vs2026-x64/WoW/bin/Release/WowError.exe
            Build/vs2026-x64/WoW/bin/Release/WowUpdateHelper.exe
            Build/vs2026-x64/WoW/bin/Release/fmod64.dll
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build bundle
        run: |
          cmake -S . -B Build/mac-arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build Build/mac-arm64 --parallel $(sysctl -n hw.ncpu)

      - name: Package bundle
        run: |
          ditto -c -k --keepParent "Build/mac-arm64/WoW/bin/World of Warcraft.app" macos-arm64.zip

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          path: macos-arm64.zip
          archive: false
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libsdl2-dev libopenal-dev libgl-dev libglu1-mesa-dev libx11-dev libstdc++-12-dev

      - name: Build executable
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B Build/linux-x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build Build/linux-x64 --parallel $(nproc)

      - name: Package executable
        run: |
          tar -czf linux-x64.tar.gz -C Build/linux-x64/WoW/bin Wow64

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: linux-x64.tar.gz
          archive: false
          if-no-files-found: error
