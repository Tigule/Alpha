name: Build Projects

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'tools/**'

  workflow_dispatch:

jobs:
  windows-legacy:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download Visual C++ 6.0
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/VC6.zip" -OutFile "VC6.zip"

      - name: Extract Visual C++ 6.0
        uses: ihiroky/extract-action@v1
        with:
          file_path: VC6.zip
          extract_dir: VC6

      - name: Download DirectX SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://tigule.org/files/ci/DXSDK90.zip" -OutFile "DXSDK90.zip"

      - name: Extract DirectX SDK
        uses: ihiroky/extract-action@v1
        with:
          file_path: DXSDK90.zip
          extract_dir: DXSDK

      - name: Replace VCVARS32 absolute paths
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'VC6/VC98/Bin/VCVARS32.BAT'
          search-text: 'set VSCommonDir=C:\PROGRA~2\Microsoft Visual Studio 6.0\Common'
          replacement-text: 'set VSCommonDir=${{ github.workspace }}\VC6\Common'

      - name: Replace VCVARS32 absolute paths
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'VC6/VC98/Bin/VCVARS32.BAT'
          search-text: 'set MSDevDir=C:\PROGRA~2\Microsoft Visual Studio 6.0\Common\msdev98'
          replacement-text: 'set MSDevDir=${{ github.workspace }}\VC6\Common\MSDev98'

      - name: Replace VCVARS32 absolute paths
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'VC6/VC98/Bin/VCVARS32.BAT'
          search-text: 'set MSVCDir=C:\PROGRA~2\Microsoft Visual Studio 6.0\VC98'
          replacement-text: 'set MSVCDir=${{ github.workspace }}\VC6\VC98'

      - name: Build solution
        shell: cmd
        env:
          DXSDK_DIR: ${{ github.workspace }}\DXSDK
        run: |
          call "VC6\VC98\Bin\VCVARS32.BAT"
          cd Build
          cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" ..
          nmake

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-legacy
          path: |
            Build/WoW/UpdateClient.exe
            Build/WoW/Wow.exe
            Build/WoW/WowError.exe
            Build/WoW/WowUpdateHelper.exe

      - name: Download validation references
        shell: pwsh
        run: |
          $base = "https://tigule.org/archive/wow/3368-0.5.3/Win32"
          New-Item -ItemType Directory -Force -Path "WoW/Client/MapFiles" | Out-Null
          Invoke-WebRequest "$base/WoWClient.exe" -OutFile "WoW/Client/WoWClient.exe"
          Invoke-WebRequest "$base/Wowae.pdb" -OutFile "WoW/Client/Wowae.pdb"
          Invoke-WebRequest "$base/MapFiles/Wowae.map" -OutFile "WoW/Client/MapFiles/Wowae.map"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run validation
        shell: pwsh
        run: |
          python Build/validate.py --summary
